name: Auto-merge Main to QE

on:
  push:
    branches:
      - main

# Explicitly grant permissions required to create a Pull Request
permissions:
  contents: read
  pull-requests: write

jobs:
  create-pull-request:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Use GitHub CLI to check for existing PRs and create a new one if needed
      - name: Create PR to QE Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for existing open PRs from main to QE..."

          # Check if an open PR already exists from main -> QE
          PR_EXISTS=$(gh pr list --base QE --head main --state open --json number -q '.[0].number')

          if [ -n "$PR_EXISTS" ]; then
            echo "An open Pull Request from main to QE already exists (PR #$PR_EXISTS). Skipping creation."
            exit 0
          fi

          echo "No open PR found. Attempting to create a new Pull Request..."

          # Create the PR. If main and QE are already identical, gh will gracefully fail, 
          # so we append '|| echo' to prevent the entire workflow pipeline from breaking.
          gh pr create \
            --base QE \
            --head main \
            --title "🔄 Automated Sync: main into QE" \
            --body "This PR was automatically generated by GitHub Actions because new commits were pushed to the \`main\` branch. Please review and approve to sync \`QE\`." || echo "Could not create PR. This usually means QE is already up-to-date with main."
