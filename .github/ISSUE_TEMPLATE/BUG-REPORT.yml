name: LooBreak Bug
description: Template for reporting bugs
body:
  - type: dropdown
    id: version
    attributes:
      label: Version
      options:
        - v1
        - v1.1
        - v1.2
        - v1.3 quiz question and answers loading on page.
        - v1.4 all 10 questions on quiz page.
        - v1.5 API brings in data and stores in Quiz collection db.
        - v1.6 Fixed issue with second click and disabled answer buttons after selected.
        - v1.7 navbar added to all pages + basic light/dark mode
        - v1.8 user tests converted to player tests. all pass on backend
        - v1.9 added in submit button and li9nk to results page when quiz is finished 
        - v1.10 fixed v1.9 issue
        # - v3
        # - v4
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "Critical"
        - "High"
        - "Medium"
        - "Low"
        - "Trivial"
  - type: dropdown
    id: suggested_priority
    attributes:
      label: Suggested Priority
      description: To aid triage and review of the issue
      options:
        - High
        - Medium
        - Low
  - type: textarea
    id: observed
    attributes:
      label: Observed Behaviour
  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      value: |
        1. 
        2. 
        3. 
