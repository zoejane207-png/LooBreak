<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="frontend/public/loobreak-logo.svg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LooBreak</title>
    <style>
      /* Static placeholder shown before React/JS boots.
         React overwrites #root on mount, so this disappears automatically. */
      @keyframes app-skeleton-pulse {
        50% {
          opacity: 0.5;
        }
      }
      .app-boot-skeleton {
        margin: 0 auto;
        display: flex;
        width: 100%;
        max-width: 28rem;
        flex-direction: column;
        gap: 0.75rem;
        padding: 1.5rem;
      }
      .app-boot-skeleton span {
        display: block;
        border-radius: 0.375rem;
        background: #e5e5e5;
        animation: app-skeleton-pulse 1.5s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot-skeleton" aria-label="Loading" role="status">
        <span style="height: 2rem; width: 8rem"></span>
        <span style="height: 1.25rem; width: 10rem"></span>
        <span style="height: 1.25rem; width: 6rem"></span>
        <span style="height: 4rem; width: 100%"></span>
        <span style="height: 2.75rem; width: 100%"></span>
        <span style="height: 2.75rem; width: 100%"></span>
        <span style="height: 2.75rem; width: 100%"></span>
        <span style="height: 2.75rem; width: 100%"></span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
